version: v2beta1
name: generic-sync-plugin

vars:
  DEVSPACE_FLAGS: "-n vcluster"

hooks:
  - name: Install Test CRD
    events: ["before:deploy"]
    command: |-
      echo "Installing test CRD on host cluster..."
      kubectl apply -f test/testdata/widget-crd.yaml
      echo "Test CRD installed!"

deployments:
  vcluster:
    helm:
      chart:
        name: vcluster
        repo: https://charts.loft.sh
        version: v0.30.4
      values:
        controlPlane:
          distro:
            k8s:
              enabled: true
          advanced:
            serviceAccount:
              enabled: false
              name: default
          statefulSet:
            image:
              repository: loft-sh/vcluster-oss
            probes:
              livenessProbe:
                enabled: false
              readinessProbe:
                enabled: false
        rbac:
          clusterRole:
            enabled: true
            extraRules:
              - apiGroups: ["apiextensions.k8s.io"]
                resources: ["customresourcedefinitions"]
                verbs: ["get", "list", "watch"]
        plugin:
          generic-sync:
            version: v2
            rbac:
              role:
                extraRules:
                  - apiGroups: ["example.com"]
                    resources: ["widgets"]
                    verbs: ["create", "delete", "patch", "update", "get", "list", "watch"]
                  - apiGroups: [""]
                    resources: ["secrets"]
                    verbs: ["get", "list", "watch"]
              clusterRole:
                extraRules:
                  - apiGroups: ["apiextensions.k8s.io"]
                    resources: ["customresourcedefinitions"]
                    verbs: ["get", "list", "watch"]
            config:
              version: v1
              log_level: "debug"
              syncResources:
                - apiVersion: example.com/v1
                  kind: Widget
                  direction: toHost
                  mode: sync
                  statusSync: true
                  patches:
                    - path: spec.secretRef.name
                      type: rewriteName
                    - path: spec.secretRef.namespace
                      type: rewriteNamespace

dev:
  vcluster:
    labelSelector:
      app: vcluster
    container: syncer
    restartHelper:
      inject: true
    command: ["/vcluster", "start"]
    sync:
      - path: ./plugin:/plugins/generic-sync/plugin
        file: true
        disableDownload: true
        onUpload:
          restartContainer: true
