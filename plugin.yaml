# Plugin Definition below. This is essentially a valid helm values file that will be merged
# with the other vcluster values during vcluster create or helm install.
plugins:
  generic-sync:
    image: ghcr.io/kupe/vcluster-generic-sync-plugin:latest
    imagePullPolicy: IfNotPresent
    rbac:
      role:
        extraRules:
          # TODO: Replace with permissions for YOUR CRDs
          - apiGroups: ["example.com"]
            resources: ["widgets"]
            verbs: ["create", "delete", "patch", "update", "get", "list", "watch"]
          # Include if your CRDs reference Secrets
          - apiGroups: [""]
            resources: ["secrets"]
            verbs: ["get", "list", "watch"]
      clusterRole:
        extraRules:
          - apiGroups: ["apiextensions.k8s.io"]
            resources: ["customresourcedefinitions"]
            verbs: ["get", "list", "watch"]

# Required for plugin to watch CRDs
rbac:
  clusterRole:
    enabled: true
