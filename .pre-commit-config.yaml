minimum_pre_commit_version: "3.7.0"
default_install_hook_types:
  - pre-commit
  - commit-msg

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c
    hooks:
      - id: detect-private-key
      - id: check-added-large-files
        args:
          - --maxkb=1024
      - id: check-json
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-yaml
        # The vendored gateway-api CRD render is a multi-document stream.
        args: [--allow-multiple-documents]
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: 3db014c16a9d31997ab8c07a4d61fcce936c8f0d
    hooks:
      - id: conventional-pre-commit
        stages:
          - commit-msg

  - repo: https://github.com/trussworks/pre-commit-hooks
    rev: f72781be8d6b5e92653232bfb13f3f10cb1fc0c4
    hooks:
      - id: markdown-toc
        files: ^README\.md$

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: 3766ad839ad3a74558031510b3bc9872bb1d9980
    hooks:
      - id: markdownlint-cli2
        files: ^README\.md$

  - repo: https://github.com/codespell-project/codespell
    rev: 2ccb47ff45ad361a21071a7eedda4c37e6ae8c5a
    hooks:
      - id: codespell
        args:
          - --write-changes
        exclude: ^(vendor/|go\.sum|coverage\.out|test/testdata/gateway-api-crds-)

  - repo: https://github.com/golangci/golangci-lint
    rev: 8f3b0c7ed018e57905fbd873c697e0b1ede605a5
    hooks:
      - id: golangci-lint
        args:
          - --timeout=10m

  - repo: local
    hooks:
      - id: actionlint
        name: actionlint
        entry: bash -c 'GOWORK=off go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12'
        language: system
        pass_filenames: false
        files: ^\.github/workflows/.*\.ya?ml$
      - id: gofmt
        name: gofmt
        entry: gofmt -w
        language: system
        types:
          - go
      - id: gosec
        name: gosec
        entry: bash -c 'GOWORK=off go run github.com/securego/gosec/v2/cmd/gosec@v2.25.0 -exclude-generated ./...'
        language: system
        pass_filenames: false
        files: ^(internal/|syncers/|test/|main\.go|go\.mod|Dockerfile|Makefile)

  # Refuse any commit whose STAGED content contains a secret. Added org-wide on
  # 2026-10-06 after three OpenTofu state files carrying a dev SSH private key
  # and a live Cloudflare Access OAuth client secret were committed to
  # kupe-tests (99e0452) and sat in history for 34 days. gitleaks v8.30.1 flags
  # all of them, so this would have blocked that commit.
  #
  # Chosen over GitHub secret scanning because push protection needs the paid
  # Secret Protection product on private repos ($19/committer/month) and only
  # alerts AFTER the push; this refuses before the commit exists.
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # v8.30.1
    hooks:
      - id: gitleaks
