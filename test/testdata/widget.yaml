apiVersion: example.com/v1
kind: Widget
metadata:
  name: my-widget
  namespace: default
  labels:
    e2e.kupecloud.io/sync: "true"
    vcluster.loft.sh/controlled-by: "generic-sync"
spec:
  model: "sparkle-9000"
  color: "sunset-orange"
  size: "pocket"
  features:
    - "auto-calibrate"
    - "whisper-mode"
  owner:
    name: "ops-team"
    team: "platform"
