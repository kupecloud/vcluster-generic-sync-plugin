# Widget CRD for testing the generic sync plugin
# This is automatically installed by DevSpace, but you can also install it manually:
#   kubectl apply -f test/testdata/widget-crd.yaml
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: widgets.example.com
spec:
  group: example.com
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                model:
                  type: string
                color:
                  type: string
                size:
                  type: string
                features:
                  type: array
                  items:
                    type: string
                owner:
                  type: object
                  properties:
                    name:
                      type: string
                    team:
                      type: string
            status:
              type: object
              properties:
                state:
                  type: string
                lastServiced:
                  type: string
                serialNumber:
                  type: string
                observedGeneration:
                  type: integer
      subresources:
        status: {}
  scope: Namespaced
  names:
    plural: widgets
    singular: widget
    kind: Widget
    shortNames:
      - wgt
