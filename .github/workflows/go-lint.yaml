name: Go Lint

on:
  workflow_call:

jobs:
  go-lint:
    uses: kupecloud/github-workflows/.github/workflows/go-lint.yaml@6c631aa5e3dc896ff8bf5cf5244df96e219fbe6f # v2.5.2
    with:
      # GitHub-hosted: this workflow also runs on pull_request, and fork PRs
      # must never execute untrusted code on the self-hosted runners.
      runs-on: ubuntu-latest
      vendor: true
      # --concurrency=2 is a MEMORY control, not a speed knob. golangci-lint
      # sizes its worker pool from the node's core count (not the cgroup CPU
      # limit), and each worker holds its own type-check state for the ~10k-file
      # vendored graph (vcluster + the k8s client stack): unbounded it peaks at
      # ~5.8GiB RSS and grows with core count; at concurrency=2 it stays at
      # ~4.6GiB regardless of node size. Fewer workers means a longer wall-clock
      # run, hence the raised timeout (the shared default is --timeout=10m).
      golangci-args: --timeout=20m --concurrency=2
