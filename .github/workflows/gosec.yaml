name: Go Security

on:
  workflow_call:

permissions:
  contents: read

jobs:
  # Uses the shared reusable rather than a local copy: since v2.3.1 the
  # govulncheck gate fails only on vulns that are reachable *and* have a
  # published fix, so the unfixable upstream vcluster/k8s advisories
  # (GO-2025-3521, GO-2025-3547, GO-2026-4883, GO-2026-4887) surface as
  # warnings instead of needing a local continue-on-error opt-out.
  go-security:
    uses: kupecloud/github-workflows/.github/workflows/go-security.yaml@a0f6412d9d08e684c39296110dbf14944d9a19ba # v2.3.1
    with:
      runs-on: kupe-small
