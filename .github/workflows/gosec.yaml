name: Go Security

on:
  workflow_call:

permissions:
  contents: read

jobs:
  gosec:
    name: Go Security Scanner
    runs-on: kupe-small
    steps:
      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install gosec
        shell: bash
        run: |
          GOBIN="$RUNNER_TEMP/bin" go install github.com/securego/gosec/v2/cmd/gosec@v2.25.0
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Run gosec
        run: gosec -exclude-generated ./...

  govulncheck:
    name: Go Vulnerability Check
    runs-on: kupe-small
    # Non-blocking, for two independent reasons:
    #  1. Upstream vcluster/k8s deps carry vulns with no published fix
    #     (GO-2025-3521, GO-2025-3547, GO-2026-4883, GO-2026-4887,
    #     GO-2026-5668, GO-2026-5932). Everything fixable is already bumped.
    #  2. govulncheck over this module graph (vcluster + full k8s) exhausts
    #     the runner on the cx33 CI pool — the step dies with a NULL
    #     conclusion ("runner lost communication"), on kupe-medium as well as
    #     kupe-small, so it cannot gate the release today.
    # Revisit both on the shared multi-cluster runner pool, where the shared
    # go-security reusable (>= v2.3.1, which only fails on reachable vulns
    # that have a fix) can replace this local copy.
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run govulncheck
        shell: bash
        run: GOWORK=off go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
