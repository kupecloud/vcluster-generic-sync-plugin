name: Go Security

on:
  pull_request:
    branches:
      - main
    paths:
      - "go.mod"
      - "go.sum"
      - "**.go"
      - ".github/workflows/gosec.yaml"
  schedule:
    - cron: "0 0 * * 1"
  workflow_call:

jobs:
  gosec:
    name: Go Security Scanner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.7"
          cache: true

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.22.0

      - name: Run gosec
        run: $(go env GOPATH)/bin/gosec -exclude-generated ./...

  govulncheck:
    name: Go Vulnerability Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.7"
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4

      - name: Run govulncheck
        run: |
          set +e
          govulncheck ./... 2>&1 | tee govulncheck-output.txt
          EXIT_CODE=$?
          set -e

          PARSED="$(mktemp)"
          summary() {
            printf '%s\n' "$*" >> "$GITHUB_STEP_SUMMARY"
          }

          awk '
          function trim(s) { gsub(/^[ \t]+|[ \t]+$/, "", s); return s }
          function flush() {
            if (!in_v) { return }
            gsub(/\t/, " ", desc)
            gsub(/\t/, " ", url)
            gsub(/\t/, " ", module)
            gsub(/\t/, " ", found)
            gsub(/\t/, " ", fixed)
            print "VULN\t" id "\t" trim(desc) "\t" trim(url) "\t" trim(module) "\t" trim(found) "\t" trim(fixed) "\t" (called ? "yes" : "no")
            for (i = 1; i <= trace_count; i++) {
              print "TRACE\t" id "\t" trace[i]
            }
          }
          BEGIN {
            in_v = 0
            trace_count = 0
            called = 0
            desc = ""
            url = ""
            module = ""
            found = ""
            fixed = ""
          }
          /^Vulnerability #[0-9]+:/ {
            flush()
            in_v = 1
            trace_count = 0
            called = 0
            desc = ""
            url = ""
            module = ""
            found = ""
            fixed = ""
            id = $3
            next
          }
          {
            line = $0
            if (in_v && line ~ /^[[:space:]]+#/) {
              gsub(/^[[:space:]]+/, "", line)
              trace[++trace_count] = line
              called = 1
              next
            }
            if (in_v && line ~ /^[[:space:]]*\.{3}$/) {
              next
            }
            if (in_v && line ~ /^[[:space:]]*More info:/) {
              sub(/^[[:space:]]*More info:[[:space:]]*/, "", line)
              url = line
              next
            }
            if (in_v && line ~ /^[[:space:]]*Module:/) {
              sub(/^[[:space:]]*Module:[[:space:]]*/, "", line)
              module = line
              next
            }
            if (in_v && line ~ /^[[:space:]]*Found in:/) {
              sub(/^[[:space:]]*Found in:[[:space:]]*/, "", line)
              found = line
              next
            }
            if (in_v && line ~ /^[[:space:]]*Fixed in:/) {
              sub(/^[[:space:]]*Fixed in:[[:space:]]*/, "", line)
              fixed = line
              next
            }
            if (in_v && line ~ /^[[:space:]]*Example traces found:/) {
              called = 1
              next
            }
            if (in_v && line ~ /^[[:space:]]+/) {
              sub(/^[[:space:]]+/, "", line)
              if (line != "") {
                desc = (desc == "" ? line : desc " " line)
              }
              next
            }
          }
          END { flush() }
          ' govulncheck-output.txt > "$PARSED"

          declare -A VULN_DESC VULN_URL VULN_MODULE VULN_FOUND VULN_FIXED VULN_CALLED
          declare -A VULN_TRACES VULN_TRACE_COUNT MODULES_CALLED
          ORDER=()

          while IFS=$'\t' read -r record_type id field1 field2 field3 field4 field5 field6; do
            if [ "$record_type" = "VULN" ]; then
              ORDER+=("$id")
              VULN_DESC["$id"]="$field1"
              VULN_URL["$id"]="$field2"
              VULN_MODULE["$id"]="$field3"
              VULN_FOUND["$id"]="$field4"
              VULN_FIXED["$id"]="$field5"
              VULN_CALLED["$id"]="$field6"
            elif [ "$record_type" = "TRACE" ]; then
              VULN_TRACE_COUNT["$id"]=$(( ${VULN_TRACE_COUNT[$id]:-0} + 1 ))
              if [ -n "${VULN_TRACES[$id]}" ]; then
                VULN_TRACES["$id"]+=$'\n'"$field1"
              else
                VULN_TRACES["$id"]="$field1"
              fi
            fi
          done < "$PARSED"

          CALLED_COUNT=0
          UNCALLED_COUNT=0
          CALLED_FIXABLE=0
          CALLED_FIXABLE_IGNORED=0
          CALLED_NOFIX=0
          UNCALLED_FIXABLE=0
          UNCALLED_NOFIX=0

          # Temporary allowlist for reachable fixable vulns that are only brought in
          # transitively from upstream dependencies and not yet upgradeable in this repo.
          IGNORED_FIXABLE_IDS=("GO-2026-4394")

          is_ignored_fixable_id() {
            local vuln_id="$1"
            for ignored_id in "${IGNORED_FIXABLE_IDS[@]}"; do
              if [ "$ignored_id" = "$vuln_id" ]; then
                return 0
              fi
            done
            return 1
          }

          for id in "${ORDER[@]}"; do
            module="${VULN_MODULE[$id]}"
            fixed="${VULN_FIXED[$id]}"
            called="${VULN_CALLED[$id]}"
            fixable="no"
            if [ -n "$fixed" ] && [ "$fixed" != "N/A" ]; then
              fixable="yes"
            fi

            if [ "$called" = "yes" ]; then
              CALLED_COUNT=$((CALLED_COUNT + 1))
              [ -n "$module" ] && MODULES_CALLED["$module"]=1
              if [ "$fixable" = "yes" ]; then
                if is_ignored_fixable_id "$id"; then
                  CALLED_FIXABLE_IGNORED=$((CALLED_FIXABLE_IGNORED + 1))
                else
                  CALLED_FIXABLE=$((CALLED_FIXABLE + 1))
                fi
              else
                CALLED_NOFIX=$((CALLED_NOFIX + 1))
              fi
            else
              UNCALLED_COUNT=$((UNCALLED_COUNT + 1))
              if [ "$fixable" = "yes" ]; then
                UNCALLED_FIXABLE=$((UNCALLED_FIXABLE + 1))
              else
                UNCALLED_NOFIX=$((UNCALLED_NOFIX + 1))
              fi
            fi
          done

          CALLED_MODULES=${#MODULES_CALLED[@]}
          INCLUDE_REACHABILITY=0
          if [ "$UNCALLED_COUNT" -gt 0 ]; then
            INCLUDE_REACHABILITY=1
          fi

          if [ "$CALLED_COUNT" -gt 0 ]; then
            summary "- **Used in code:** ${CALLED_COUNT} vulns across ${CALLED_MODULES} module(s) (fixes available: ${CALLED_FIXABLE})."
          else
            summary "- **Used in code:** 0"
          fi
          if [ "$UNCALLED_COUNT" -gt 0 ]; then
            summary "- **Imported only:** ${UNCALLED_COUNT} vulns (fixes available: ${UNCALLED_FIXABLE})."
          else
            summary "- **Imported only:** 0"
          fi
          if [ "$CALLED_FIXABLE_IGNORED" -gt 0 ]; then
            summary "- **Ignored (temporary allowlist):** ${CALLED_FIXABLE_IGNORED} fixable used vuln(s): ${IGNORED_FIXABLE_IDS[*]}"
          fi

          if [ "$EXIT_CODE" -ne 0 ] && [ "${#ORDER[@]}" -eq 0 ]; then
            summary ""
            summary "❌ **Error:** govulncheck exited non-zero but no vulnerabilities were parsed."
            echo "::error::govulncheck exited non-zero but no vulnerabilities were parsed."
            exit 1
          fi

          if [ "${#ORDER[@]}" -gt 0 ]; then
            summary ""
            summary "### Vulnerabilities"
          fi

          for id in "${ORDER[@]}"; do
            desc="${VULN_DESC[$id]}"
            url="${VULN_URL[$id]}"
            module="${VULN_MODULE[$id]}"
            found="${VULN_FOUND[$id]}"
            fixed="${VULN_FIXED[$id]}"
            called="${VULN_CALLED[$id]}"
            fixable="No"
            if [ -n "$fixed" ] && [ "$fixed" != "N/A" ]; then
              fixable="Yes"
            fi
            reachability="Imported only"
            if [ "$called" = "yes" ]; then
              reachability="Used in code"
            fi

            summary ""
            summary "#### ${id}"
            if [ -n "$desc" ]; then
              summary "$desc"
            fi
            if [ -n "$url" ]; then
              summary "More info: <${url}>"
            fi
            summary ""
            summary "| Field | Value |"
            summary "| --- | --- |"
            summary "| Module | ${module:-N/A} |"
            summary "| Found in | ${found:-N/A} |"
            summary "| Fixed in | ${fixed:-N/A} |"
            if [ "$INCLUDE_REACHABILITY" -eq 1 ]; then
              summary "| Reachability | ${reachability} |"
            fi
            summary "| Trace count | ${VULN_TRACE_COUNT[$id]:-0} |"
          done

          if [ "$CALLED_FIXABLE" -gt 0 ]; then
            summary ""
            summary "❌ **Action required:** Fixable vulnerabilities are used in code. Please update dependencies."
            echo "::error::Fixable vulnerabilities are used in code. Please update dependencies."
            exit 1
          fi

          if [ "$CALLED_COUNT" -eq 0 ] && [ "$UNCALLED_COUNT" -eq 0 ]; then
            summary ""
            summary "✅ **Success:** No vulnerabilities have been found."
          elif [ "$CALLED_COUNT" -gt 0 ] && [ "$CALLED_FIXABLE" -eq 0 ]; then
            summary ""
            summary "⚠️ **Warning:** Used vulnerabilities have no fixes available."
            echo "::warning::Used vulnerabilities have no fixes available."
          elif [ "$UNCALLED_COUNT" -gt 0 ]; then
            summary ""
            summary "ℹ️ **Notice:** Vulnerabilities are present only in uncalled code paths."
            echo "::notice::Vulnerabilities are present only in uncalled code paths."
          fi

          if [ $EXIT_CODE -ne 0 ]; then
            exit 0
          fi
