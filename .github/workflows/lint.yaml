name: Lint

on:
  pull_request:
    branches:
      - main
    paths:
      - "go.mod"
      - "go.sum"
      - "**.go"
      - ".github/workflows/lint.yaml"
      - ".golangci.yaml"
  workflow_call:

jobs:
  golangci-lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Ensure vendor directory
        run: go mod vendor

      - name: Run golangci-lint
        id: golangci
        uses: golangci/golangci-lint-action@v9
        with:
          args: --timeout=10m

      - name: golangci-lint summary
        if: always()
        run: |
          {
            echo "### golangci-lint"
            echo ""
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| golangci-lint | ${{ steps.golangci.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  go-fmt:
    name: Check go fmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        id: gofmt
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "The following files are not formatted correctly:"
            gofmt -l .
            echo ""
            echo "Please run 'gofmt -w .' to fix formatting."
            exit 1
          fi

      - name: gofmt summary
        if: always()
        run: |
          {
            echo "### gofmt"
            echo ""
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| gofmt | ${{ steps.gofmt.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  actionlint:
    name: Lint GitHub Actions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Run actionlint
        id: actionlint
        uses: rhysd/actionlint@v1.7.10

      - name: actionlint summary
        if: always()
        run: |
          {
            echo "### actionlint"
            echo ""
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| actionlint | ${{ steps.actionlint.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"
