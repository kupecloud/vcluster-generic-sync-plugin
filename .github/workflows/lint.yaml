name: Lint

on:
  pull_request:
    branches:
      - main
    paths:
      - "go.mod"
      - "go.sum"
      - "**.go"
      - ".github/workflows/lint.yaml"
      - ".golangci.yaml"
  workflow_call:

jobs:
  golangci-lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Ensure vendor directory
        run: go mod vendor

      - name: Run golangci-lint
        id: golangci
        uses: golangci/golangci-lint-action@v9
        with:
          args: --timeout=10m

      - name: golangci-lint summary
        if: always()
        run: |
          if [ "${{ steps.golangci.outcome }}" = "success" ]; then
            {
              echo "Go linting passed."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "Go linting failed."
              echo ""
              echo "- Review the job logs for full details."
              echo "- Or run: \`make lint\` locally to recreate"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  go-fmt:
    name: Check go fmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        id: gofmt
        run: |
          gofmt -l . > gofmt-files.txt
          if [ -s gofmt-files.txt ]; then
            echo "The following files are not formatted correctly:"
            cat gofmt-files.txt
            echo ""
            echo "Please run 'gofmt -w .' to fix formatting."
            exit 1
          fi

      - name: gofmt summary
        if: always()
        run: |
          if [ "${{ steps.gofmt.outcome }}" = "success" ]; then
            {
              echo "Go formatting passed."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "Go formatting failed."
              echo ""
              echo "\`\`\`"
              if [ -s gofmt-files.txt ]; then
                cat gofmt-files.txt
              else
                echo "No files captured."
              fi
              echo "\`\`\`"
              echo "Please run \`gofmt -w .\` to fix formatting."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  actionlint:
    name: Lint GitHub Actions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Run actionlint
        id: actionlint
        uses: rhysd/actionlint@v1.7.10

      - name: actionlint summary
        if: always()
        run: |
          if [ "${{ steps.actionlint.outcome }}" = "success" ]; then
            {
              echo "### actionlint"
              echo "actionlint passed."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### actionlint"
              echo "actionlint failed."
              echo ""
              echo "- Review the job logs for details."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
