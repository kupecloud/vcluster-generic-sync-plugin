name: Docker Build

on:
  workflow_call:
    inputs:
      push:
        description: "Push image to registry"
        required: false
        default: false
        type: boolean
      version:
        description: "Version tag for the image"
        required: false
        default: ""
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Do NOT reintroduce a `github.event_name == 'workflow_call'` guard here.
  # Inside a called reusable workflow `github.event_name` is the ORIGINAL
  # triggering event of the caller (`push` for main.yaml), never
  # 'workflow_call' — so that guard was always false and silently zeroed both
  # values: v1.4.0 was tagged and released with NO image pushed (the build ran
  # with push=false and only a :<sha> tag), and the sign/sbom jobs never ran.
  # This workflow is `on: workflow_call` only, so `inputs` is always the right
  # and only source of truth.
  PUSH_IMAGE: ${{ inputs.push }}
  RELEASE_VERSION: ${{ inputs.version }}

jobs:
  build:
    name: Build Docker Image
    runs-on: kupe-medium
    permissions:
      contents: read
      packages: write
      id-token: write

    outputs:
      digest: ${{ steps.build.outputs.digest }}
      tags: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@6524bf65af31da8d45b59e8c27de4bd072b392f5 # v3.8.0

      - name: Log in to GitHub Container Registry
        if: env.PUSH_IMAGE == 'true'
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@369eb591f429131d6889c46b94e711f089e6ca96 # v5.6.1
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.RELEASE_VERSION }},enable=${{ env.RELEASE_VERSION != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.RELEASE_VERSION }},enable=${{ env.RELEASE_VERSION != '' }}
            type=semver,pattern={{major}},value=${{ env.RELEASE_VERSION }},enable=${{ env.RELEASE_VERSION != '' }}
            type=raw,value=latest,enable=${{ env.RELEASE_VERSION != '' }}
            type=ref,event=pr,enable=${{ env.RELEASE_VERSION == '' }}
            type=sha,prefix=

      - name: Set build date
        id: date
        run: echo "build_date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          platforms: linux/amd64
          push: ${{ env.PUSH_IMAGE == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ env.RELEASE_VERSION != '' && format('v{0}', env.RELEASE_VERSION) || github.sha }}
            GIT_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.date.outputs.build_date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  sign:
    name: Sign Docker Image
    runs-on: kupe-medium
    needs: build
    if: inputs.push
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign the published Docker image
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
          TAGS: ${{ needs.build.outputs.tags }}
        run: |
          mapfile -t tag_list <<< "$TAGS"
          images=()
          for tag in "${tag_list[@]}"; do
            [ -n "$tag" ] && images+=("${tag}@${DIGEST}")
          done
          if [ "${#images[@]}" -gt 0 ]; then
            cosign sign --yes "${images[@]}"
          fi

  sbom:
    name: Generate SBOM
    runs-on: kupe-medium
    needs: build
    if: inputs.push
    permissions:
      contents: write
      packages: read

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate SBOM
        uses: anchore/sbom-action@da167eac915b4e86f08b264dbdbc867b61be6f0c # v0.20.5
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Attach SBOM to release
        if: env.RELEASE_VERSION != ''
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          tag_name: v${{ env.RELEASE_VERSION }}
          files: sbom.spdx.json
