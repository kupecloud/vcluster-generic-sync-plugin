name: Docker Build

on:
  workflow_call:
    inputs:
      push:
        description: "Push image to registry"
        required: false
        default: false
        type: boolean
      version:
        description: "Version tag for the image"
        required: false
        default: ""
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Do NOT reintroduce a `github.event_name == 'workflow_call'` guard here.
  # Inside a called reusable workflow `github.event_name` is the ORIGINAL
  # triggering event of the caller (`push` for main.yaml), never
  # 'workflow_call' — so that guard was always false and silently zeroed both
  # values: v1.4.0 was tagged and released with NO image pushed (the build ran
  # with push=false and only a :<sha> tag), and the sign/sbom jobs never ran.
  # This workflow is `on: workflow_call` only, so `inputs` is always the right
  # and only source of truth.
  PUSH_IMAGE: ${{ inputs.push }}
  RELEASE_VERSION: ${{ inputs.version }}

jobs:
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    outputs:
      digest: ${{ steps.build.outputs.digest }}
      tags: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        if: env.PUSH_IMAGE == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.RELEASE_VERSION }},enable=${{ env.RELEASE_VERSION != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.RELEASE_VERSION }},enable=${{ env.RELEASE_VERSION != '' }}
            type=semver,pattern={{major}},value=${{ env.RELEASE_VERSION }},enable=${{ env.RELEASE_VERSION != '' }}
            type=raw,value=latest,enable=${{ env.RELEASE_VERSION != '' }}
            type=ref,event=pr,enable=${{ env.RELEASE_VERSION == '' }}
            type=sha,prefix=

      - name: Set build date
        id: date
        run: echo "build_date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: ${{ env.PUSH_IMAGE == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ env.RELEASE_VERSION != '' && format('v{0}', env.RELEASE_VERSION) || github.sha }}
            GIT_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.date.outputs.build_date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  sign:
    name: Sign Docker Image
    runs-on: ubuntu-latest
    needs: build
    if: inputs.push
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # Pin the cosign BINARY, not just the action: cosign-installer bakes a
          # default cosign version into each release, so bumping the action alone
          # silently changes the tool's MAJOR version — and cosign v3 flipped the
          # defaults of both flags the sign step depends on. Matches the shared
          # publish-image.yaml.
          cosign-release: v3.0.6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign the published Docker image
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
          TAGS: ${{ needs.build.outputs.tags }}
        run: |
          mapfile -t tag_list <<< "$TAGS"
          images=()
          for tag in "${tag_list[@]}"; do
            [ -n "$tag" ] && images+=("${tag}@${DIGEST}")
          done
          if [ "${#images[@]}" -gt 0 ]; then
            # legacy .sig format — see the shared publish-image.yaml note
            # (GHCR referrers 404 + kyverno bundle discovery has no tag fallback)
            # BOTH flags are required, and passing only --new-bundle-format is a hard
            # error on cosign v3 ("must provide --new-bundle-format or --bundle where
            # applicable with --signing-config or --use-signing-config"): v3 defaults
            # both to true and refuses --new-bundle-format=false without the
            # signing-config opt-out. Both flags exist on v2 too, so this is correct on
            # either major. Do NOT simplify to a bare `cosign sign --yes`: on v3 that
            # SUCCEEDS and emits a bundle, leaving CI green and the image unverifiable.
            cosign sign --yes --new-bundle-format=false --use-signing-config=false "${images[@]}"
          fi

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    needs: build
    if: inputs.push
    permissions:
      contents: write
      packages: read

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Attach SBOM to release
        if: env.RELEASE_VERSION != ''
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ env.RELEASE_VERSION }}
          files: sbom.spdx.json
