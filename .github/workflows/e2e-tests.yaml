name: E2E Tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  e2e-tests:
    name: Run E2E tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Ensure vendor directory
        run: go mod vendor

      - name: Set up Helm
        uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0
        with:
          version: "v3.14.0"

      - name: Run E2E tests
        id: e2e
        env:
          KIND_NODE_IMAGE: kindest/node:v1.35.0
        run: |
          set +e
          set -o pipefail
          go test -json -mod=vendor -tags=e2e -timeout=30m ./test/e2e/... \
            | tee e2e-tests.json \
            | awk '
              {
                action=""; test=""; output=""
                if (match($0, /"Action":"([^"]+)"/, m)) action=m[1]
                if (match($0, /"Test":"([^"]+)"/, m)) test=m[1]
                if (match($0, /"Output":"([^"]*)"/, m)) output=m[1]
                gsub(/\\\\t/, "\t", output)
                gsub(/\\\\n$/, "", output)
                if (action == "run" && test != "") {
                  print "=== RUN   " test
                } else if (action == "pass" && test != "") {
                  print "--- PASS: " test
                } else if (action == "fail" && test != "") {
                  print "--- FAIL: " test
                } else if (action == "skip" && test != "") {
                  print "--- SKIP: " test
                } else if (action == "output" && output != "") {
                  print output
                }
              }
            '
          EXIT_CODE=$?
          set +o pipefail
          set -e
          exit $EXIT_CODE

      - name: E2E test summary
        if: always()
        run: |
          if [ -f e2e-tests.json ]; then
            pass=$(awk -F'"' '/"Action":"pass"/ && /"Test":/ {count++} END {print count+0}' e2e-tests.json)
            fail=$(awk -F'"' '/"Action":"fail"/ && /"Test":/ {count++} END {print count+0}' e2e-tests.json)
            skip=$(awk -F'"' '/"Action":"skip"/ && /"Test":/ {count++} END {print count+0}' e2e-tests.json)
          else
            pass=0
            fail=0
            skip=0
          fi
          total=$((pass + fail + skip))
          {
            echo "### E2E tests"
            echo ""
            echo "| Metric | Count |"
            echo "| --- | --- |"
            echo "| Total | ${total} |"
            echo "| Passed | ${pass} |"
            echo "| Failed | ${fail} |"
            echo "| Skipped | ${skip} |"
            echo ""
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| e2e tests | ${{ steps.e2e.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Collect logs on failure
        if: failure()
        run: |
          echo "=== Kind cluster info ==="
          kubectl cluster-info || true
          echo "=== Pods in all namespaces ==="
          kubectl get pods -A || true
          echo "=== Events ==="
          kubectl get events -A --sort-by='.lastTimestamp' || true
          echo "=== vCluster logs ==="
          kubectl logs -l app=vcluster -n vcluster -c syncer --tail=500 || true
