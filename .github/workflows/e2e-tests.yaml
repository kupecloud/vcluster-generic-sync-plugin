name: E2E Tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  e2e-tests:
    name: Run E2E tests
    runs-on: kupe-medium
    steps:
      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Ensure vendor directory
        run: go mod vendor

      - name: Set up Helm
        uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0
        with:
          version: "v3.14.0"

      # This job ran on ubuntu-latest until 2026-05-19 (e56c6c5 moved it to
      # kupe-medium) and has not been green since, because GitHub's hosted image
      # preinstalls kubectl and the kind CLI while our self-hosted runner image
      # (github-runners/Dockerfile — a thin layer over actions-runner) does not.
      # The suite needs BOTH: helpers.go/portforward.go shell out to `kubectl`,
      # and install.go runs `kind load docker-image`. (The kind *cluster* itself
      # is created through the vendored kind Go library, so only the load step
      # needs the binary.) Docker itself comes from the kupe-medium DinD sidecar.
      #
      # Everything installs into $RUNNER_TEMP/bin: the runner is non-root, so
      # /usr/local/bin is not writable, and job-time apt is unreliable on these
      # pods. Same pattern as gosec.yaml.
      #
      # Keep the kind version in step with the `sigs.k8s.io/kind` require in
      # go.mod so the CLI and the vendored library agree on cluster layout.
      - name: Install kind and kubectl
        env:
          KIND_VERSION: v0.31.0
          KUBECTL_VERSION: v1.35.4
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          GOWORK=off GOBIN="$RUNNER_TEMP/bin" go install "sigs.k8s.io/kind@${KIND_VERSION}"
          curl -fsSLo "$RUNNER_TEMP/bin/kubectl" \
            "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          chmod +x "$RUNNER_TEMP/bin/kubectl"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # NOTE: deliberately NOT `go test -json | awk ...`. The previous version
      # pretty-printed the JSON stream with awk's three-argument match(), which
      # is a GNU awk extension; the runner image ships mawk, so awk died with
      # "syntax error at or near ," on its first line and pipefail failed the
      # step with exit 2 before a single test result was visible. Plain `-v`
      # output needs no JSON parsing at all and is portable to any awk.
      - name: Run E2E tests
        id: e2e
        env:
          KIND_NODE_IMAGE: kindest/node:v1.35.0
        run: |
          set +e
          set -o pipefail
          go test -mod=vendor -tags=e2e -timeout=30m -v ./test/e2e/... 2>&1 \
            | tee e2e-tests.log
          EXIT_CODE=$?
          set +o pipefail
          set -e
          exit $EXIT_CODE

      - name: E2E test summary
        if: always()
        run: |
          if [ -f e2e-tests.log ]; then
            # `grep -c` exits 1 when it matches nothing, which would kill the
            # step under `bash -e`, hence the `|| true`. The leading ` *` counts
            # subtests too — go indents those under their parent.
            pass=$(grep -cE '^ *--- PASS:' e2e-tests.log || true)
            fail=$(grep -cE '^ *--- FAIL:' e2e-tests.log || true)
            skip=$(grep -cE '^ *--- SKIP:' e2e-tests.log || true)
          else
            pass=0
            fail=0
            skip=0
          fi
          total=$((pass + fail + skip))
          {
            echo "### E2E tests"
            echo ""
            echo "| Metric | Count |"
            echo "| --- | --- |"
            echo "| Total | ${total} |"
            echo "| Passed | ${pass} |"
            echo "| Failed | ${fail} |"
            echo "| Skipped | ${skip} |"
            echo ""
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| e2e tests | ${{ steps.e2e.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Collect logs on failure
        if: failure()
        run: |
          echo "=== Kind cluster info ==="
          kubectl cluster-info || true
          echo "=== Pods in all namespaces ==="
          kubectl get pods -A || true
          echo "=== Events ==="
          kubectl get events -A --sort-by='.lastTimestamp' || true
          echo "=== vCluster logs ==="
          kubectl logs -l app=vcluster -n vcluster -c syncer --tail=500 || true
