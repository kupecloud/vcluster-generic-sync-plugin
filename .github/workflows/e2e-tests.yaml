name: E2E Tests

on:
  pull_request:
    branches:
      - main
    paths:
      - "go.mod"
      - "go.sum"
      - "**.go"
      - "test/e2e/**"
      - "Dockerfile"
      - ".github/workflows/e2e-tests.yaml"
  workflow_call:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-ci
  TAG_NAME: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}

jobs:
  build:
    name: Build plugin image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Ensure vendor directory
        run: go mod vendor

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and export Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.TAG_NAME }}
          outputs: type=docker,dest=/tmp/plugin-image.tar
          build-args: |
            VERSION=ci-${{ github.sha }}
            GIT_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}

      - name: Upload image artifact
        uses: actions/upload-artifact@v6
        with:
          name: plugin-image
          path: /tmp/plugin-image.tar
          retention-days: 1

  e2e-tests:
    name: Run E2E tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Ensure vendor directory
        run: go mod vendor

      - name: Download plugin image
        uses: actions/download-artifact@v7
        with:
          name: plugin-image
          path: /tmp

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.14.0"

      - name: Set up Kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: e2e-test
          node_image: kindest/node:v1.35.0

      - name: Load plugin image into Kind
        run: |
          docker load --input /tmp/plugin-image.tar
          for attempt in 1 2 3 4 5; do
            if kind load docker-image ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.TAG_NAME }} --name e2e-test; then
              exit 0
            fi
            echo "kind load failed (attempt ${attempt}); retrying in 10s..."
            sleep 10
          done
          echo "kind load failed after retries."
          exit 1

      - name: Install vcluster CLI
        run: |
          curl -L -o vcluster "https://github.com/loft-sh/vcluster/releases/latest/download/vcluster-linux-amd64"
          chmod +x vcluster
          sudo mv vcluster /usr/local/bin/

      - name: Run E2E tests
        id: e2e
        env:
          E2E_PLUGIN_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.TAG_NAME }}
          KIND_CLUSTER_NAME: e2e-test
        run: |
          set +e
          set -o pipefail
          go test -json -mod=vendor -tags=e2e -timeout=30m ./test/e2e/... | tee e2e-tests.json
          EXIT_CODE=$?
          set +o pipefail
          set -e
          exit $EXIT_CODE

      - name: E2E test summary
        if: always()
        run: |
          if [ -f e2e-tests.json ]; then
            pass=$(awk -F'"' '/"Action":"pass"/ && /"Test":/ {count++} END {print count+0}' e2e-tests.json)
            fail=$(awk -F'"' '/"Action":"fail"/ && /"Test":/ {count++} END {print count+0}' e2e-tests.json)
            skip=$(awk -F'"' '/"Action":"skip"/ && /"Test":/ {count++} END {print count+0}' e2e-tests.json)
          else
            pass=0
            fail=0
            skip=0
          fi
          total=$((pass + fail + skip))
          {
            echo "### E2E tests"
            echo ""
            echo "| Metric | Count |"
            echo "| --- | --- |"
            echo "| Total | ${total} |"
            echo "| Passed | ${pass} |"
            echo "| Failed | ${fail} |"
            echo "| Skipped | ${skip} |"
            echo ""
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| e2e tests | ${{ steps.e2e.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Collect logs on failure
        if: failure()
        run: |
          echo "=== Kind cluster info ==="
          kubectl cluster-info
          echo "=== Pods in all namespaces ==="
          kubectl get pods -A
          echo "=== Events ==="
          kubectl get events -A --sort-by='.lastTimestamp'
          echo "=== vCluster logs ==="
          kubectl logs -l app=vcluster -n vcluster -c syncer --tail=500 || true
