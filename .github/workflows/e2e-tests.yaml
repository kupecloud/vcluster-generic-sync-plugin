name: E2E Tests

on:
  pull_request:
    branches:
      - main
    paths:
      - "go.mod"
      - "go.sum"
      - "**.go"
      - "test/e2e/**"
      - "Dockerfile"
      - ".github/workflows/e2e-tests.yaml"
  workflow_call:

jobs:
  e2e-tests:
    name: Run E2E tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Ensure vendor directory
        run: go mod vendor

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.14.0"

      - name: Run E2E tests
        id: e2e
        env:
          KIND_NODE_IMAGE: kindest/node:v1.35.0
        run: |
          set +e
          set -o pipefail
          go test -json -mod=vendor -tags=e2e -timeout=30m ./test/e2e/... | tee e2e-tests.json
          EXIT_CODE=$?
          set +o pipefail
          set -e
          exit $EXIT_CODE

      - name: E2E test summary
        if: always()
        run: |
          if [ -f e2e-tests.json ]; then
            pass=$(awk -F'"' '/"Action":"pass"/ && /"Test":/ {count++} END {print count+0}' e2e-tests.json)
            fail=$(awk -F'"' '/"Action":"fail"/ && /"Test":/ {count++} END {print count+0}' e2e-tests.json)
            skip=$(awk -F'"' '/"Action":"skip"/ && /"Test":/ {count++} END {print count+0}' e2e-tests.json)
          else
            pass=0
            fail=0
            skip=0
          fi
          total=$((pass + fail + skip))
          {
            echo "### E2E tests"
            echo ""
            echo "| Metric | Count |"
            echo "| --- | --- |"
            echo "| Total | ${total} |"
            echo "| Passed | ${pass} |"
            echo "| Failed | ${fail} |"
            echo "| Skipped | ${skip} |"
            echo ""
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| e2e tests | ${{ steps.e2e.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Collect logs on failure
        if: failure()
        run: |
          echo "=== Kind cluster info ==="
          kubectl cluster-info || true
          echo "=== Pods in all namespaces ==="
          kubectl get pods -A || true
          echo "=== Events ==="
          kubectl get events -A --sort-by='.lastTimestamp' || true
          echo "=== vCluster logs ==="
          kubectl logs -l app=vcluster -n vcluster -c syncer --tail=500 || true
