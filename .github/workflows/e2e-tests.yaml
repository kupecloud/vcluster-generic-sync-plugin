name: E2E Tests

on:
  pull_request:
    branches:
      - main
    paths:
      - "go.mod"
      - "go.sum"
      - "**.go"
      - "test/e2e/**"
      - "Dockerfile"
      - ".github/workflows/e2e-tests.yaml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-ci
  TAG_NAME: pr-${{ github.event.number }}

jobs:
  build:
    name: Build plugin image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build plugin binary
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -mod=vendor \
            -ldflags "-X github.com/kupecloud/vcluster-generic-sync-plugin/syncers.Version=ci-${{ github.sha }}" \
            -o plugin main.go

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and export Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.TAG_NAME }}
          outputs: type=docker,dest=/tmp/plugin-image.tar
          build-args: |
            VERSION=ci-${{ github.sha }}
            GIT_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-image
          path: /tmp/plugin-image.tar
          retention-days: 1

  e2e-tests:
    name: Run E2E tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download plugin image
        uses: actions/download-artifact@v4
        with:
          name: plugin-image
          path: /tmp

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.14.0"

      - name: Set up Kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: e2e-test
          node_image: kindest/node:v1.30.0

      - name: Load plugin image into Kind
        run: |
          docker load --input /tmp/plugin-image.tar
          kind load docker-image ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.TAG_NAME }} --name e2e-test

      - name: Install vcluster CLI
        run: |
          curl -L -o vcluster "https://github.com/loft-sh/vcluster/releases/latest/download/vcluster-linux-amd64"
          chmod +x vcluster
          sudo mv vcluster /usr/local/bin/

      - name: Run E2E tests
        env:
          E2E_PLUGIN_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.TAG_NAME }}
          KIND_CLUSTER_NAME: e2e-test
        run: |
          go test -mod=vendor -tags=e2e -timeout=30m -v ./test/e2e/...

      - name: Collect logs on failure
        if: failure()
        run: |
          echo "=== Kind cluster info ==="
          kubectl cluster-info
          echo "=== Pods in all namespaces ==="
          kubectl get pods -A
          echo "=== Events ==="
          kubectl get events -A --sort-by='.lastTimestamp'
          echo "=== vCluster logs ==="
          kubectl logs -l app=vcluster -n vcluster -c syncer --tail=500 || true
