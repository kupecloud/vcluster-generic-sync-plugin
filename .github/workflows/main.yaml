name: "Main"

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Do NOT cancel in-progress main runs: a run cancelled after `release` has
  # tagged a version but before `docker` pushes the image leaves a git version
  # with no matching image (ImagePullBackOff for chart installs).
  # Queued runs still coalesce; only pr.yaml may cancel in progress.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  go-lint:
    name: Go Lint
    uses: ./.github/workflows/go-lint.yaml

  action-lint:
    name: Action Lint
    uses: ./.github/workflows/action-lint.yaml

  unit-tests:
    name: Unit Tests
    needs:
      - go-lint
      - action-lint
    uses: ./.github/workflows/unit-tests.yaml

  gosec:
    name: Go Security
    needs:
      - unit-tests
    # Shared reusable (>= v2.3.1) instead of the old local copy: it FAILS on a
    # reachable vulnerability that has a published fix and only WARNS on
    # reachable ones with no upstream fix (today GO-2026-5932 x/crypto
    # openpgp, GO-2026-4883/4887 docker/docker, GO-2025-3521/3547
    # k8s.io/kubernetes, all via the loft vcluster SDK). A no-fix advisory
    # starts failing on its own the day upstream ships a fix, so the
    # exception list maintains itself. Note: govulncheck over the vcluster +
    # full k8s graph peaks at ~4.8 GiB, so the runner needs the memory for it.
    uses: kupecloud/github-workflows/.github/workflows/go-security.yaml@6c631aa5e3dc896ff8bf5cf5244df96e219fbe6f # v2.5.2
    with:
      runs-on: ubuntu-latest

  e2e-tests:
    name: E2E Tests
    needs:
      - gosec
    uses: ./.github/workflows/e2e-tests.yaml

  release:
  # NOTE: the kind-based E2E job runs for signal but deliberately does NOT gate
  # the release: it takes tens of minutes and a flake there must not block
  # shipping. The fast gates (lint, unit, gosec, audits) still gate.
    name: Release
    needs:
      - gosec
    uses: kupecloud/github-workflows/.github/workflows/semantic-release.yaml@6c631aa5e3dc896ff8bf5cf5244df96e219fbe6f # v2.5.2
    with:
      runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      packages: write
      id-token: write
    secrets: inherit

  docker:
    name: Docker Build
    needs:
      - release
    if: needs.release.outputs.new_release_published == 'true'
    uses: ./.github/workflows/docker.yaml
    permissions:
      contents: write
      packages: write
      id-token: write
    with:
      push: true
      version: ${{ needs.release.outputs.new_release_version }}
