name: Trivy

on:
  pull_request:
    branches:
      - main
    paths:
      - "go.mod"
      - "go.sum"
      - "**.go"
      - "Dockerfile"
      - ".github/workflows/trivy.yaml"
  push:
    branches:
      - main
  schedule:
    # Run weekly on Monday at 00:00 UTC
    - cron: "0 0 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  trivy-scan:
    name: Trivy Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Run Trivy vulnerability scanner (filesystem)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "table"
          output: "trivy-results.txt"
          severity: "CRITICAL,HIGH"

      - name: Add Trivy results to job summary
        if: always()
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          cat trivy-results.txt >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      - name: Check for vulnerabilities
        run: |
          if grep -q "Total: [1-9]" trivy-results.txt 2>/dev/null; then
            echo "Vulnerabilities found!"
            exit 1
          fi

  trivy-image-scan:
    name: Trivy Image Scan
    runs-on: ubuntu-latest
    # Only run on push to main or scheduled runs
    if: github.event_name == 'push' || github.event_name == 'schedule'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image for scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: vcluster-generic-sync-plugin:trivy
          build-args: |
            VERSION=scan
            GIT_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}

      - name: Run Trivy vulnerability scanner (image)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "vcluster-generic-sync-plugin:trivy"
          format: "table"
          output: "trivy-image-results.txt"
          severity: "CRITICAL,HIGH"

      - name: Add Trivy image results to job summary
        if: always()
        run: |
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          cat trivy-image-results.txt >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      - name: Check for image vulnerabilities
        run: |
          if grep -q "Total: [1-9]" trivy-image-results.txt 2>/dev/null; then
            echo "Vulnerabilities found in image!"
            exit 1
          fi
