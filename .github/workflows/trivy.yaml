name: Trivy

on:
  pull_request:
    branches:
      - main
    paths:
      - "go.mod"
      - "go.sum"
      - "**.go"
      - "Dockerfile"
      - ".github/workflows/trivy.yaml"
  schedule:
    # Run weekly on Monday at 00:00 UTC
    - cron: "0 0 * * 1"
  workflow_call:
    inputs:
      run_image_scan:
        description: "Run the image scan step"
        required: false
        default: false
        type: boolean

jobs:
  trivy-scan:
    name: Trivy Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Run Trivy vulnerability scanner (filesystem)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "table"
          output: "trivy-results.txt"
          severity: "CRITICAL,HIGH"

      - name: Add Trivy results to job summary
        if: always()
        run: |
          # Clean up output: remove "Report Summary" header and extra whitespace
          sed '/^Report Summary$/d' trivy-results.txt | sed '/^$/d' > trivy-results-clean.txt
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          cat trivy-results-clean.txt >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      - name: Check for vulnerabilities
        run: |
          if grep -q "Total: [1-9]" trivy-results.txt 2>/dev/null; then
            echo "Vulnerabilities found!"
            exit 1
          fi

  trivy-image-scan:
    name: Trivy Image Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || inputs.run_image_scan == true
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image for scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: vcluster-generic-sync-plugin:trivy
          build-args: |
            VERSION=scan
            GIT_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}

      - name: Run Trivy vulnerability scanner (image)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "vcluster-generic-sync-plugin:trivy"
          format: "table"
          output: "trivy-image-results.txt"
          severity: "CRITICAL,HIGH"

      - name: Add Trivy image results to job summary
        if: always()
        run: |
          # Clean up output: remove "Report Summary" header and extra whitespace
          sed '/^Report Summary$/d' trivy-image-results.txt | sed '/^$/d' > trivy-image-results-clean.txt
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          cat trivy-image-results-clean.txt >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      - name: Check for image vulnerabilities
        run: |
          if grep -q "Total: [1-9]" trivy-image-results.txt 2>/dev/null; then
            echo "Vulnerabilities found in image!"
            exit 1
          fi
