name: Trivy

on:
  pull_request:
    branches:
      - main
    paths:
      - "go.mod"
      - "go.sum"
      - "**.go"
      - "Dockerfile"
      - ".github/workflows/trivy.yaml"
  schedule:
    - cron: "0 0 * * 1"
  workflow_call:
    inputs:
      run_image_scan:
        description: "Run the image scan step"
        required: false
        default: false
        type: boolean

jobs:
  trivy-scan:
    name: Trivy Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Run Trivy vulnerability scanner (filesystem)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "json"
          output: "trivy-results.json"
          severity: "CRITICAL,HIGH"

      - name: Summarize results
        if: always()
        run: |
          summary() { printf '%s\n' "$*" >> "$GITHUB_STEP_SUMMARY"; }

          CRITICAL_FIXABLE=0
          CRITICAL_UNFIXABLE=0
          HIGH_FIXABLE=0
          HIGH_UNFIXABLE=0
          ROWS=""

          while IFS=$'\t' read -r vuln_id severity pkg installed fixed; do
            [ -z "$vuln_id" ] && continue
            fixable="No"
            if [ -n "$fixed" ] && [ "$fixed" != "null" ]; then
              fixable="Yes"
            fi

            ROWS+="| ${severity} | ${vuln_id} | ${pkg} | ${installed} | ${fixed:-N/A} | ${fixable} |"$'\n'

            if [ "$severity" = "CRITICAL" ]; then
              if [ "$fixable" = "Yes" ]; then
                CRITICAL_FIXABLE=$((CRITICAL_FIXABLE + 1))
              else
                CRITICAL_UNFIXABLE=$((CRITICAL_UNFIXABLE + 1))
              fi
            elif [ "$severity" = "HIGH" ]; then
              if [ "$fixable" = "Yes" ]; then
                HIGH_FIXABLE=$((HIGH_FIXABLE + 1))
              else
                HIGH_UNFIXABLE=$((HIGH_UNFIXABLE + 1))
              fi
            fi
          done < <(jq -r '
            [.Results[]? | select(.Vulnerabilities) | .Vulnerabilities[]
              | {VulnerabilityID, Severity, PkgName, InstalledVersion, FixedVersion}]
            | unique_by(.VulnerabilityID + .PkgName)
            | sort_by(if .Severity == "CRITICAL" then 0 else 1 end)[]
            | [.VulnerabilityID, .Severity, .PkgName, .InstalledVersion, .FixedVersion // ""]
            | @tsv
          ' trivy-results.json)

          TOTAL=$((CRITICAL_FIXABLE + CRITICAL_UNFIXABLE + HIGH_FIXABLE + HIGH_UNFIXABLE))
          TOTAL_FIXABLE=$((CRITICAL_FIXABLE + HIGH_FIXABLE))

          summary "### Filesystem Scan"
          summary ""
          summary "| | Fixable | Unfixable | Total |"
          summary "| --- | --- | --- | --- |"
          summary "| CRITICAL | ${CRITICAL_FIXABLE} | ${CRITICAL_UNFIXABLE} | $((CRITICAL_FIXABLE + CRITICAL_UNFIXABLE)) |"
          summary "| HIGH | ${HIGH_FIXABLE} | ${HIGH_UNFIXABLE} | $((HIGH_FIXABLE + HIGH_UNFIXABLE)) |"
          summary "| **Total** | **${TOTAL_FIXABLE}** | **$((CRITICAL_UNFIXABLE + HIGH_UNFIXABLE))** | **${TOTAL}** |"

          if [ "$TOTAL" -gt 0 ]; then
            summary ""
            summary "#### Details"
            summary ""
            summary "| Severity | CVE | Package | Installed | Fixed | Fixable |"
            summary "| --- | --- | --- | --- | --- | --- |"
            printf '%s' "$ROWS" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "$TOTAL_FIXABLE" -gt 0 ]; then
            summary ""
            summary "**Action required:** ${TOTAL_FIXABLE} fixable vulnerabilities found. Please update dependencies."
            echo "::error::${TOTAL_FIXABLE} fixable vulnerabilities found. Please update dependencies."
            exit 1
          elif [ "$TOTAL" -gt 0 ]; then
            summary ""
            summary "Vulnerabilities found but no fixes are currently available."
            echo "::warning::${TOTAL} vulnerabilities found but no fixes are currently available."
          else
            summary ""
            summary "No vulnerabilities found."
          fi

  trivy-image-scan:
    name: Trivy Image Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || inputs.run_image_scan == true
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image for scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: vcluster-generic-sync-plugin:trivy
          build-args: |
            VERSION=scan
            GIT_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}

      - name: Run Trivy vulnerability scanner (image)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: "vcluster-generic-sync-plugin:trivy"
          format: "json"
          output: "trivy-image-results.json"
          severity: "CRITICAL,HIGH"

      - name: Summarize results
        if: always()
        run: |
          summary() { printf '%s\n' "$*" >> "$GITHUB_STEP_SUMMARY"; }

          CRITICAL_FIXABLE=0
          CRITICAL_UNFIXABLE=0
          HIGH_FIXABLE=0
          HIGH_UNFIXABLE=0
          ROWS=""

          while IFS=$'\t' read -r vuln_id severity pkg installed fixed; do
            [ -z "$vuln_id" ] && continue
            fixable="No"
            if [ -n "$fixed" ] && [ "$fixed" != "null" ]; then
              fixable="Yes"
            fi

            ROWS+="| ${severity} | ${vuln_id} | ${pkg} | ${installed} | ${fixed:-N/A} | ${fixable} |"$'\n'

            if [ "$severity" = "CRITICAL" ]; then
              if [ "$fixable" = "Yes" ]; then
                CRITICAL_FIXABLE=$((CRITICAL_FIXABLE + 1))
              else
                CRITICAL_UNFIXABLE=$((CRITICAL_UNFIXABLE + 1))
              fi
            elif [ "$severity" = "HIGH" ]; then
              if [ "$fixable" = "Yes" ]; then
                HIGH_FIXABLE=$((HIGH_FIXABLE + 1))
              else
                HIGH_UNFIXABLE=$((HIGH_UNFIXABLE + 1))
              fi
            fi
          done < <(jq -r '
            [.Results[]? | select(.Vulnerabilities) | .Vulnerabilities[]
              | {VulnerabilityID, Severity, PkgName, InstalledVersion, FixedVersion}]
            | unique_by(.VulnerabilityID + .PkgName)
            | sort_by(if .Severity == "CRITICAL" then 0 else 1 end)[]
            | [.VulnerabilityID, .Severity, .PkgName, .InstalledVersion, .FixedVersion // ""]
            | @tsv
          ' trivy-image-results.json)

          TOTAL=$((CRITICAL_FIXABLE + CRITICAL_UNFIXABLE + HIGH_FIXABLE + HIGH_UNFIXABLE))
          TOTAL_FIXABLE=$((CRITICAL_FIXABLE + HIGH_FIXABLE))

          summary "### Image Scan"
          summary ""
          summary "| | Fixable | Unfixable | Total |"
          summary "| --- | --- | --- | --- |"
          summary "| CRITICAL | ${CRITICAL_FIXABLE} | ${CRITICAL_UNFIXABLE} | $((CRITICAL_FIXABLE + CRITICAL_UNFIXABLE)) |"
          summary "| HIGH | ${HIGH_FIXABLE} | ${HIGH_UNFIXABLE} | $((HIGH_FIXABLE + HIGH_UNFIXABLE)) |"
          summary "| **Total** | **${TOTAL_FIXABLE}** | **$((CRITICAL_UNFIXABLE + HIGH_UNFIXABLE))** | **${TOTAL}** |"

          if [ "$TOTAL" -gt 0 ]; then
            summary ""
            summary "#### Details"
            summary ""
            summary "| Severity | CVE | Package | Installed | Fixed | Fixable |"
            summary "| --- | --- | --- | --- | --- | --- |"
            printf '%s' "$ROWS" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "$TOTAL_FIXABLE" -gt 0 ]; then
            summary ""
            summary "**Action required:** ${TOTAL_FIXABLE} fixable vulnerabilities found. Please update dependencies."
            echo "::error::${TOTAL_FIXABLE} fixable vulnerabilities found. Please update dependencies."
            exit 1
          elif [ "$TOTAL" -gt 0 ]; then
            summary ""
            summary "Vulnerabilities found but no fixes are currently available."
            echo "::warning::${TOTAL} vulnerabilities found but no fixes are currently available."
          else
            summary ""
            summary "No vulnerabilities found."
          fi
