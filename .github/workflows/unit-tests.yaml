name: Unit Tests

on:
  workflow_call:

jobs:
  unit-tests:
    uses: kupecloud/github-workflows/.github/workflows/go-unit-tests.yaml@6c631aa5e3dc896ff8bf5cf5244df96e219fbe6f # v2.5.2
    with:
      # GitHub-hosted: runs on pull_request, so fork PRs must not reach the
      # self-hosted runners.
      runs-on: ubuntu-latest
      # The shared workflow's default test-command runs with -race. Public-repo
      # hosted runners (4 cores / 16GB) have the memory for the race detector
      # over the vendored vcluster + k8s client graph; if this job ever OOMs
      # (NULL step conclusion that looks like a hang), the fallback is a
      # test-command override without -race plus `make test-race` locally.
