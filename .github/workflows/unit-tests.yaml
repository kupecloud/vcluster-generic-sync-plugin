name: Unit Tests

on:
  pull_request:
    branches:
      - main
    paths:
      - "go.mod"
      - "go.sum"
      - "**.go"
      - "!test/e2e/**"
      - ".github/workflows/unit-tests.yaml"
  workflow_call:

jobs:
  unit-tests:
    name: Run unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run go vet
        id: govet
        run: go vet ./...

      - name: Run unit tests
        id: unit
        run: |
          set +e
          set -o pipefail
          go test -json -race -coverprofile=coverage.out ./... | tee unit-tests.json
          EXIT_CODE=$?
          set +o pipefail
          set -e
          exit $EXIT_CODE

      - name: Unit test summary
        if: always()
        run: |
          if [ -f unit-tests.json ]; then
            pass=$(awk -F'"' '/"Action":"pass"/ && /"Test":/ {count++} END {print count+0}' unit-tests.json)
            fail=$(awk -F'"' '/"Action":"fail"/ && /"Test":/ {count++} END {print count+0}' unit-tests.json)
            skip=$(awk -F'"' '/"Action":"skip"/ && /"Test":/ {count++} END {print count+0}' unit-tests.json)
          else
            pass=0
            fail=0
            skip=0
          fi
          total=$((pass + fail + skip))
          coverage="n/a"
          if [ -f coverage.out ]; then
            coverage=$(go tool cover -func=coverage.out | awk 'END {print $3}')
          fi
          {
            echo "### Unit tests"
            echo ""
            echo "| Metric | Count |"
            echo "| --- | --- |"
            echo "| Total | ${total} |"
            echo "| Passed | ${pass} |"
            echo "| Failed | ${fail} |"
            echo "| Skipped | ${skip} |"
            echo "| Coverage | ${coverage} |"
            echo ""
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| go vet | ${{ steps.govet.outcome }} |"
            echo "| go test | ${{ steps.unit.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.out
          retention-days: 7

  go-mod-tidy:
    name: Check go mod tidy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Check go mod tidy
        run: |
          go mod tidy
          if ! git diff --quiet go.mod go.sum; then
            echo "go.mod or go.sum is not tidy. Please run 'go mod tidy' and commit the changes."
            git diff go.mod go.sum
            exit 1
          fi
